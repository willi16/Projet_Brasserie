{% extends 'base.html' %}
{% load static %}

{% block title %}Historique complet des actions{% endblock %}

{% block content %}
<div>
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-2xl font-semibold">Historique complet des actions</h2>
        <a href="?export=excel" class="btn btn-success btn-sm">Exporter en Excel</a>
    </div>

    <div class="card p-0 overflow-x-auto mb-4">
        <table id="table-logs" class="table display">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Admin</th>
                    <th>Action</th>
                    <th>Utilisateur</th>
                    <th>Détails</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  $('#table-logs').DataTable({
    processing: true,
    dom: '<"dt-topbar"l<"dt-colfilters">f>rt<"dt-bottom"ip>',
    serverSide: true,
    ajax: {
      url: "{% url 'gestion_depot:dt_logs' %}",
      type: 'GET'
    },
    columns: [
      { data: 'timestamp', searchable: false },
      { data: 'performed_by_nom' },
      { data: 'action_display' },
      { data: 'target_user_nom' },
      { data: 'details', render: function (d) { return '<small>' + (d || '—') + '</small>'; } }
    ],
    order: [[0, 'desc']],
    pageLength: 10,
    lengthMenu: [5, 10, 15],
    language: { url: "{% static 'js/french.json' %}" },
    initComplete: function () {
      var api = this.api();
      var container = $(api.table().container()).find('.dt-colfilters');
      if (!container.length) return;
      api.columns().every(function () {
        var col = this;
        var searchable = api.settings()[0].aoColumns[col.index()].bSearchable !== false;
        if (!searchable) return;
        var title = $(col.header()).text().trim();
        $('<input class="form-input !px-2 !py-1 !text-sm rounded-full" placeholder="Filtrer ' + title + '" autocomplete="off" style="width:170px">')
          .appendTo(container)
          .on('keyup change', function () {
            if (col.search() !== this.value) col.search(this.value).draw();
          });
      });
    }
  });
});
</script>
{% endblock %}
