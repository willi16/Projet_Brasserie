{% extends 'base.html' %}

{% block title %}Modifier les rôles de {{ user.username }}{% endblock %}

{% block content %}
<div class="max-w-xl">
    <h3 class="text-xl font-semibold mb-4">Modifier les rôles de {{ user.username }}</h3>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Rôles</label>
                <div class="space-y-2">
                    {% for group in all_groups %}
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input class="h-4 w-4 rounded border-gray-300 text-brand-600 focus:ring-brand-400" type="checkbox" name="groups" value="{{ group.id }}"
                            {% if group.id in user_groups %}checked{% endif %}>
                        <span class="text-sm">{{ group.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{% url 'gestion_depot:manage_users' %}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
