{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ action }} un produit{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h2 class="text-2xl font-semibold mb-4">{{ action }} un produit</h2>

  <div class="card">
    <form method="post" {% if action == 'Modifier' %}class="confirm-form" data-title="Modifier le produit" data-text="Confirmer l'enregistrement des modifications ?" data-confirm-text="Enregistrer"{% endif %}>
      {% csrf_token %}
      {% crispy form %}
      <div class="flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">{{ action }}</button>
        <a href="{% url 'gestion_depot:liste_produits' %}" class="btn btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
