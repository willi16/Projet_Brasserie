{% extends "base.html" %}
{% load static %}

{% block title %}Liste des fournisseurs{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <h2 class="text-2xl font-semibold">Liste des fournisseurs</h2>
  <a href="{% url 'gestion_depot:ajouter_fournisseur' %}" class="btn btn-primary">Ajouter un fournisseur</a>
</div>

<div class="card p-0 overflow-x-auto">
  <table id="table-fournisseurs" class="table display">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Contact</th>
        <th>Adresse</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tfoot>
      <tr>
        <th>Nom</th>
        <th>Contact</th>
        <th>Adresse</th>
        <th></th>
      </tr>
    </tfoot>
  </table>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  $('#table-fournisseurs').DataTable({
    processing: true,
    serverSide: true,
    ajax: {
      url: "{% url 'gestion_depot:dt_fournisseurs' %}",
      type: 'GET'
    },
    columns: [
      { data: 'nom' },
      { data: 'contact', render: function (d) { return d || '-'; } },
      { data: 'adresse', render: function (d) { return d || '-'; } },
      { data: 'actions_html', orderable: false, searchable: false }
    ],
    order: [[0, 'asc']],
    pageLength: 10,
    lengthMenu: [5, 10, 15],
    language: { url: "{% static 'js/french.json' %}" },
    initComplete: function () {
      var api = this.api();
      api.columns().every(function () {
        var col = this;
        if (!col.searchable()) return;
        $('<input class="form-input !w-full !px-2 !py-1 !text-sm" placeholder="Filtrer..." autocomplete="off">')
          .appendTo($(col.footer()))
          .on('keyup change', function () {
            if (col.search() !== this.value) col.search(this.value).draw();
          });
      });
    }
  });
});
</script>
{% endblock %}
