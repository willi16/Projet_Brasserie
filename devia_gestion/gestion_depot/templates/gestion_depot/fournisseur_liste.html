{% extends "base.html" %}
{% load static %}

{% block title %}Liste des fournisseurs{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <h2 class="text-2xl font-semibold">Liste des fournisseurs</h2>
  <a href="{% url 'gestion_depot:ajouter_fournisseur' %}" class="btn btn-primary">Ajouter un fournisseur</a>
</div>

<div class="card p-0 overflow-x-auto">
  <table id="table-fournisseurs" class="table display">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Contact</th>
        <th>Adresse</th>
        <th>Actions</th>
      </tr>
    </thead>
  </table>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  $('#table-fournisseurs').DataTable({
    processing: true,
    dom: '<"dt-topbar"l<"dt-colfilters">f>rt<"dt-bottom"ip>',
    serverSide: true,
    ajax: {
      url: "{% url 'gestion_depot:dt_fournisseurs' %}",
      type: 'GET'
    },
    columns: [
      { data: 'nom' },
      { data: 'contact', render: function (d) { return d || '-'; } },
      { data: 'adresse', render: function (d) { return d || '-'; } },
      { data: 'actions_html', orderable: false, searchable: false }
    ],
    order: [[0, 'asc']],
    pageLength: 10,
    lengthMenu: [5, 10, 15],
    language: { url: "{% static 'js/french.json' %}" },
    initComplete: function () {
      var api = this.api();
      var container = $(api.table().container()).find('.dt-colfilters');
      if (!container.length) return;
      api.columns().every(function () {
        var col = this;
        var searchable = api.settings()[0].aoColumns[col.index()].bSearchable !== false;
        if (!searchable) return;
        var title = $(col.header()).text().trim();
        $('<input class="form-input !px-2 !py-1 !text-sm rounded-full" placeholder="Filtrer ' + title + '" autocomplete="off" style="width:170px">')
          .appendTo(container)
          .on('keyup change', function () {
            if (col.search() !== this.value) col.search(this.value).draw();
          });
      });
    }
  });
});
</script>
{% endblock %}
