{% extends 'base.html' %}
{% load static %}

{% block title %}Gérer les comptes utilisateurs{% endblock %}

{% block content %}
<div>
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-2xl font-semibold">Gérer les comptes utilisateurs</h2>
        <a href="{% url 'gestion_depot:user_logs_full' %}" class="btn btn-secondary btn-sm">Voir tout l'historique</a>
    </div>

    <div class="card mb-4">
        <div class="flex items-center gap-2">
            <label for="filter-group" class="form-label mb-0">Filtrer par rôle :</label>
            <select name="group" id="filter-group" class="form-select w-auto">
                <option value="all" {% if not selected_group or selected_group == "all" %}selected{% endif %}>Tous les rôles</option>
                {% for group in all_groups %}
                    <option value="{{ group.name }}" {% if selected_group == group.name %}selected{% endif %}>{{ group.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="card p-0 overflow-x-auto mb-4">
        <table id="table-users" class="table display">
            <thead>
                <tr>
                    <th>Nom d'utilisateur</th>
                    <th>Email</th>
                    <th>Statut</th>
                    <th>Rôle</th>
                    <th>Actions</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  var table = $('#table-users').DataTable({
    processing: true,
    dom: '<"dt-topbar"l<"dt-colfilters">f>rt<"dt-bottom"ip>',
    serverSide: true,
    ajax: {
      url: "{% url 'gestion_depot:dt_users' %}",
      type: 'GET',
      data: function (d) {
        d.group = $('#filter-group').val();
      }
    },
    columns: [
      { data: 'username' },
      { data: 'email', render: function (d) { return d || '-'; } },
      { data: 'statut_html', orderable: false, searchable: false },
      { data: 'roles_html', orderable: false, searchable: false },
      { data: 'actions_html', orderable: false, searchable: false }
    ],
    order: [[0, 'asc']],
    pageLength: 10,
    lengthMenu: [5, 10, 15],
    language: { url: "{% static 'js/french.json' %}" },
    initComplete: function () {
      var api = this.api();
      var container = $(api.table().container()).find('.dt-colfilters');
      if (!container.length) return;
      api.columns().every(function () {
        var col = this;
        var searchable = api.settings()[0].aoColumns[col.index()].bSearchable !== false;
        if (!searchable) return;
        var title = $(col.header()).text().trim();
        $('<input class="form-input !px-2 !py-1 !text-sm rounded-full" placeholder="Filtrer ' + title + '" autocomplete="off" style="width:170px">')
          .appendTo(container)
          .on('keyup change', function () {
            if (col.search() !== this.value) col.search(this.value).draw();
          });
      });
    }
  });

  $('#filter-group').on('change', function () {
    table.ajax.reload();
  });
});
</script>
{% endblock %}
