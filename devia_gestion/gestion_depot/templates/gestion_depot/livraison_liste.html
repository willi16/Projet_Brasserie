{% extends "base.html" %}
{% load static %}

{% block title %}Liste des livraisons{% endblock %}

{% block content %}
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-semibold">Liste des livraisons</h2>
    <a href="{% url 'gestion_depot:creer_bon_livraison' %}" class="btn btn-primary">Enregistrer une livraison</a>
  </div>

  <div class="card p-0 overflow-x-auto">
    <table id="table-livraisons" class="table display">
      <thead>
        <tr>
          <th>Référence</th>
          <th>Date</th>
          <th>Fournisseur</th>
          <th>Utilisateur</th>
          <th>Total casiers</th>
          <th>Total (FCFA)</th>
          <th>Actions</th>
        </tr>
      </thead>
  </table>
  </div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  $('#table-livraisons').DataTable({
    processing: true,
    dom: '<"dt-topbar"l<"dt-colfilters">f>rt<"dt-bottom"ip>',
    serverSide: true,
    ajax: {
      url: "{% url 'gestion_depot:dt_livraisons' %}",
      type: 'GET'
    },
    columns: [
      { data: 'reference' },
      { data: 'date_livraison', searchable: false },
      { data: 'fournisseur_nom' },
      { data: 'utilisateur_nom' },
      { data: 'total_quantite', searchable: false },
      { data: 'total_montant', searchable: false, render: function (d) { return d + ' FCFA'; } },
      { data: 'actions_html', orderable: false, searchable: false }
    ],
    order: [[1, 'desc']],
    pageLength: 10,
    lengthMenu: [5, 10, 15],
    language: { url: "{% static 'js/french.json' %}" },
    initComplete: function () {
      var api = this.api();
      var container = $(api.table().container()).find('.dt-colfilters');
      if (!container.length) return;
      api.columns().every(function () {
        var col = this;
        var searchable = api.settings()[0].aoColumns[col.index()].bSearchable !== false;
        if (!searchable) return;
        var title = $(col.header()).text().trim();
        $('<input class="form-input !px-2 !py-1 !text-sm rounded-full" placeholder="Filtrer ' + title + '" autocomplete="off" style="width:170px">')
          .appendTo(container)
          .on('keyup change', function () {
            if (col.search() !== this.value) col.search(this.value).draw();
          });
      });
    }
  });
});
</script>
{% endblock %}
