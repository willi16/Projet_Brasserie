{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Créer un compte employé{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card">
    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-200 dark:border-gray-700">
      <h4 class="text-xl font-semibold">Créer un compte employé</h4>
    </div>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% crispy form %}
      <div class="flex gap-2 mt-4">
        <a href="{% url 'gestion_depot:dashboard' %}" class="btn btn-secondary flex-1">Annuler</a>
        <button type="submit" class="btn btn-success flex-1">Créer le compte</button>
        
      </div>
    </form>
  </div>
</div>
{% endblock %}
