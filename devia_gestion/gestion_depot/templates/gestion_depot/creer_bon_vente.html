{% extends "base.html" %}

{% block title %}Créer un bon de vente{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-4">Créer un bon de vente</h2>

<form method="post" id="bon-vente-form" class="card">
  {% csrf_token %}
  <div class="mb-3">
    <label for="client_nom" class="form-label">Nom du client</label>
    <input type="text" class="form-input" id="client_nom" name="client_nom" required>
  </div>

  <div class="mb-3">
    <label for="type_paiement" class="form-label">Type de paiement</label>
    <select class="form-select" id="type_paiement" name="type_paiement" required>
      <option value="especes">Espèces</option>
      <option value="credit">Crédit</option>
    </select>
  </div>

  <h4 class="font-semibold text-lg mb-3">Lignes de vente</h4>
  <div id="lignes-container" class="space-y-3">
    <div class="ligne product-row border border-gray-200 dark:border-gray-700 rounded-lg p-3">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
        <div class="md:col-span-4">
          <label class="form-label">Produit</label>
          <select name="produit" class="form-select produit-select" required>
            <option value="">-- Sélectionner --</option>
            {% for produit in produits %}
              <option
                value="{{ produit.id }}"
                data-price="{{ produit.prix_vente_casier }}"
                data-stock="{{ produit.stock_actuel|default:0 }}"
                data-nom="{{ produit.nom }}">
                {{ produit.nom }} ({{ produit.prix_vente_casier }} FCFA)
              </option>
            {% endfor %}
          </select>
          <small class="stock-info text-gray-500 dark:text-gray-400 text-xs mt-1 block">Stock: <span class="stock-value">0</span> casiers</small>
          <small class="error-stock text-red-600 dark:text-red-400 text-xs mt-1 block hidden">Stock insuffisant</small>
        </div>
        <div class="md:col-span-3">
          <label class="form-label">Fraction</label>
          <input type="number" name="fraction" class="form-input" min="0.25" step="0.25" max="9.99" value="1.00" required>
          <small class="text-gray-500 dark:text-gray-400 text-xs mt-1 block">Ex. 1.00 = casier complet, 0.50 = demi-casier</small>
        </div>
        <div class="md:col-span-3">
          <label class="form-label">Quantité</label>
          <input type="number" name="quantite" class="form-input" min="0.01" step="0.01" required>
          <small class="text-gray-500 dark:text-gray-400 text-xs mt-1 block">&nbsp;</small>
        </div>
        <div class="md:col-span-2 flex items-center justify-end">
          <button type="button" class="btn btn-danger remove-ligne">Supprimer</button>
        </div>
      </div>
    </div>
  </div>

  <div class="flex flex-wrap gap-2 mt-4 justify-center">
    <button type="button" id="add-ligne" class="btn btn-secondary">Ajouter une ligne</button>
    <button type="submit" class="btn btn-primary" id="submit-btn">Créer le bon</button>
  </div>
</form>

<!-- Aperçu du total -->
<div id="preview-total" class="card mt-3 bg-sky-50 dark:bg-gray-800 hidden">
  <strong>Total estimé :</strong> <span id="total-amount">0</span> FCFA
</div>

<script>
  // Stocker les données des produits
  const produitsData = {};
  document.querySelectorAll('.produit-select option[value]').forEach(opt => {
    const id = opt.value;
    produitsData[id] = {
      nom: opt.dataset.nom,
      prix: parseFloat(opt.dataset.price),
      stock: parseFloat(opt.dataset.stock)
    };
  });

  // Mettre à jour le stock affiché
  function updateStockDisplay(row) {
    const select = row.querySelector('.produit-select');
    const stockInfo = row.querySelector('.stock-value');
    const errorInfo = row.querySelector('.error-stock');
    const quantiteInput = row.querySelector('input[name="quantite"]');
    const fractionSelect = row.querySelector('input[name="fraction"]');

    const produitId = select.value;
    if (!produitId) {
      stockInfo.textContent = '0';
      errorInfo.classList.add('hidden');
      return;
    }

    const stock = produitsData[produitId]?.stock || 0;
    const quantite = parseFloat(quantiteInput.value) || 0;
    const fraction = parseFloat(fractionSelect.value) || 0;
    const quantiteTotale = quantite * fraction;

    stockInfo.textContent = stock;

    if (quantiteTotale > stock) {
      errorInfo.classList.remove('hidden');
      quantiteInput.classList.add('border-red-500');
    } else {
      errorInfo.classList.add('hidden');
      quantiteInput.classList.remove('border-red-500');
    }
  }

  // Calcul du total en temps réel
  function updatePreview() {
    let total = 0;
    let stockInsuffisant = false;

    document.querySelectorAll('.product-row').forEach(row => {
      const select = row.querySelector('.produit-select');
      const fractionSelect = row.querySelector('input[name="fraction"]');
      const quantiteInput = row.querySelector('input[name="quantite"]');

      if (!select || !fractionSelect || !quantiteInput) return;

      const produitId = select.value;
      const fraction = parseFloat(fractionSelect.value) || 0;
      const quantite = parseFloat(quantiteInput.value) || 0;

      if (!produitId || quantite <= 0) return;

      const prixVente = produitsData[produitId]?.prix || 0;
      const ligneTotal = prixVente * fraction * quantite;
      total += ligneTotal;

      // Vérifier le stock
      const stock = produitsData[produitId]?.stock || 0;
      if (quantite * fraction > stock) {
        stockInsuffisant = true;
      }
    });

    document.getElementById('total-amount').textContent = Math.round(total);
    document.getElementById('preview-total').classList.toggle('hidden', total <= 0);

    return !stockInsuffisant;
  }

  // Gestion des lignes dynamiques
  document.getElementById('add-ligne').addEventListener('click', function () {
    const container = document.getElementById('lignes-container');
    const newLigne = container.querySelector('.ligne').cloneNode(true);

    // Réinitialiser
    newLigne.querySelector('.produit-select').value = '';
    newLigne.querySelector('input[name="fraction"]').value = '1.00';
    newLigne.querySelector('input[name="quantite"]').value = '';
    newLigne.querySelector('input[name="quantite"]').classList.remove('border-red-500');
    newLigne.querySelector('.error-stock').classList.add('hidden');

    // Attacher suppression
    newLigne.querySelector('.remove-ligne').addEventListener('click', function () {
      newLigne.remove();
      updatePreview();
    });

    // Attacher événements
    newLigne.querySelectorAll('select, input').forEach(el => {
      el.addEventListener('change', () => {
        updateStockDisplay(newLigne);
        updatePreview();
      });
      el.addEventListener('input', () => {
        updateStockDisplay(newLigne);
        updatePreview();
      });
    });

    container.appendChild(newLigne);
  });

  // Suppression des lignes existantes
  document.querySelectorAll('.remove-ligne').forEach(btn => {
    btn.addEventListener('click', function () {
      this.closest('.ligne').remove();
      updatePreview();
    });
  });

  // Mise à jour du stock quand produit change
  document.querySelectorAll('.produit-select').forEach(select => {
    select.addEventListener('change', function() {
      const row = this.closest('.product-row');
      updateStockDisplay(row);
      updatePreview();
    });
  });

  // Mise à jour quand quantité ou fraction change
  document.querySelectorAll('input[name="quantite"], input[name="fraction"]').forEach(el => {
    el.addEventListener('change', updatePreview);
    el.addEventListener('input', updatePreview);
  });

  // Confirmation avant soumission
  document.getElementById('bon-vente-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    const total = parseFloat(document.getElementById('total-amount').textContent) || 0;
    const stockOK = updatePreview(); // Vérifie aussi le stock

    if (total <= 0) {
      await Swal.fire({
        icon: 'warning',
        title: 'Aucun produit',
        text: 'Veuillez ajouter au moins un produit valide.'
      });
      return;
    }

    if (!stockOK) {
      await Swal.fire({
        icon: 'warning',
        title: 'Stock insuffisant',
        text: 'Stock insuffisant pour un ou plusieurs produits. Veuillez ajuster les quantités.'
      });
      return;
    }

    const result = await Swal.fire({
      icon: 'question',
      title: 'Confirmer la création du bon de vente ?',
      text: 'Total : ' + total + ' FCFA',
      showCancelButton: true,
      confirmButtonText: 'Confirmer',
      cancelButtonText: 'Annuler'
    });

    if (result.isConfirmed) {
      form.submit();
    }
  });

  // Initialisation
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.product-row').forEach(row => {
      updateStockDisplay(row);
    });
    updatePreview();
  });
</script>
{% endblock %}
