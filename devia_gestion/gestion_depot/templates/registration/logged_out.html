{% extends "base.html" %}

{% block title %}Déconnexion{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="card text-center">
    <div class="mx-auto mb-3 h-14 w-14 rounded-full bg-brand-100 dark:bg-brand-900 flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-brand-600 dark:text-brand-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    </div>
    <h4 class="text-lg font-semibold mb-2">Vous avez été déconnecté</h4>
    <p class="text-gray-500 dark:text-gray-400 text-sm mb-4">Votre session a été fermée avec succès.</p>
    <a href="{% url 'login' %}" class="btn btn-primary">Se reconnecter</a>
  </div>
</div>
{% endblock %}
