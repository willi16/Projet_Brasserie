{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="fr" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion</title>

    <!-- Tailwind CSS local -->
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  </head>
  <body>
    <div class="flex flex-col md:flex-row w-full min-h-screen shadow-lg">
      <!-- Colonne de gauche : image -->
      <div class="relative md:flex-1 flex flex-col justify-center items-center text-white text-center px-8 py-12 h-56 md:h-auto"
           style="background-image: url('{% static "images/youki.jpg" %}'); background-size: cover; background-position: center; background-repeat: no-repeat;">
        <div class="absolute inset-0 bg-black/50"></div>
        <div class="relative z-10 max-w-md">
          <h3 class="text-3xl font-semibold mb-4 drop-shadow">Bienvenue !</h3>
          <p class="text-lg leading-relaxed">Connectez-vous pour accéder à votre espace sécurisé.</p>
        </div>
      </div>

      <!-- Colonne de droite : formulaire -->
      <div class="md:flex-1 bg-white dark:bg-gray-900 px-6 py-10 md:py-0 flex flex-col justify-center items-center overflow-y-auto">
        <div class="w-full max-w-sm">
          <div class="flex items-center justify-between mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">Connexion</h2>
            <button id="dark-mode-toggle" type="button" aria-label="Mode sombre"
                    class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" id="dark-icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" id="dark-icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
          </div>

          {% if form.non_field_errors %}
            <div class="mb-4 border border-red-400 rounded-lg bg-red-100 dark:bg-red-900 px-4 py-3 text-red-700 dark:text-red-200 text-sm text-center">
              Nom d'utilisateur ou mot de passe incorrect.
            </div>
          {% endif %}

          <form method="post">
            {% csrf_token %}
            {% crispy form %}
            <button type="submit" class="btn btn-primary w-full mt-4">Se connecter</button>
          </form>

          <div class="text-center mt-4">
            <small><a href="#" class="text-gray-500 dark:text-gray-400 hover:text-brand-600 underline text-sm">Mot de passe oublié ?</a></small>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const darkBtn = document.getElementById('dark-mode-toggle');
        if (darkBtn) {
          const isDark = localStorage.getItem('dark-mode') === 'true';
          if (isDark) document.documentElement.classList.add('dark');
          updateDarkIcon();
          darkBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('dark-mode', document.documentElement.classList.contains('dark'));
            updateDarkIcon();
          });
        }
        function updateDarkIcon() {
          const moon = document.getElementById('dark-icon-moon');
          const sun = document.getElementById('dark-icon-sun');
          if (!moon || !sun) return;
          const isDark = document.documentElement.classList.contains('dark');
          moon.classList.toggle('hidden', isDark);
          sun.classList.toggle('hidden', !isDark);
        }
      });
    </script>
  </body>
</html>
